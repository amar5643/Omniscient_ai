[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscient-ai"
version = "5.1.0"
description = "Omniscient AI research, engineering and analytics assistant"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4"
]

[tool.setuptools]
py-modules = ["streamlit_app"]
